name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build self-contained exe
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish (self-contained, single file)
        run: |
          dotnet publish src/Ping -c Release -r win-x64 --self-contained `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:Version="${{ github.ref_type == 'tag' && github.ref_name || '1.0.0' }}"

      - name: Rename exe
        shell: pwsh
        run: |
          $dir = 'src/Ping/bin/Release/net8.0-windows/win-x64/publish'
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { 'dev' }
          Rename-Item "$dir/Ping.exe" "Ping-$tag.exe"
          Compress-Archive -Path "$dir/Ping-$tag.exe" -DestinationPath "Ping-$tag.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ping-win-x64
          path: Ping-*.zip

      - name: Draft release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Ping-*.zip
          generate_release_notes: true
